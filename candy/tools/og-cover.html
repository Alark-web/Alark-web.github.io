<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OG cover</title>
<!--
  Исходник обложки для соцсетей. Рендерится в assets/img/og-cover.png командой:
  chrome --headless=new --screenshot=assets/img/og-cover.png --window-size=1200,630 tools/og-cover.html
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: linear-gradient(135deg, #14392b 0%, #0c241b 55%, #123326 100%);
    font-family: "Manrope", "Segoe UI", Arial, sans-serif; color: #eef4ee;
  }
  .glow {
    position: absolute; right: -140px; top: -160px; width: 780px; height: 780px; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,191,139,.28) 0%, transparent 62%);
  }
  .rings { position: absolute; right: 120px; top: 60px; }
  .rings i {
    position: absolute; border: 1px solid rgba(255,255,255,.09); border-radius: 50%;
    left: 50%; top: 50%; transform: translate(-50%,-50%);
  }
  .content { position: relative; padding: 60px 80px 64px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 44px; height: 44px; }
  .brand b { font-size: 22px; font-weight: 800; letter-spacing: .04em; display: block; line-height: 1; }
  .brand small { font-size: 10px; letter-spacing: .32em; color: #8fb9a2; }
  h1 { font-size: 62px; line-height: 1.04; letter-spacing: -.045em; font-weight: 800; max-width: 640px; }
  h1 em { font-style: normal; color: #6fd6a4; }
  p { margin-top: 22px; font-size: 22px; color: #a9c8b7; max-width: 560px; line-height: 1.4; }
  .tags { display: flex; gap: 10px; }
  .tags span {
    padding: 10px 20px; border: 1px solid rgba(255,255,255,.18); border-radius: 100px;
    font-size: 15px; font-weight: 600; color: #cfe4d7;
  }
  .dishes { position: absolute; right: -30px; bottom: -60px; width: 620px; height: 620px; }
  .dishes img { position: absolute; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .d1 { width: 320px; right: 40px; top: 40px; }
  .d2 { width: 250px; right: 250px; top: 250px; }
  .d3 { width: 210px; right: 10px; top: 320px; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="rings">
  <i style="width:420px;height:420px"></i>
  <i style="width:600px;height:600px"></i>
  <i style="width:780px;height:780px"></i>
</div>

<div class="dishes">
  <img class="d1" src="../assets/img/culture-rhodosporidium.svg" alt="">
  <img class="d2" src="../assets/img/culture-chlorella.svg" alt="">
  <img class="d3" src="../assets/img/culture-saccharomyces.svg" alt="">
</div>

<div class="content">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18.5" fill="none" stroke="#8fd7b1" stroke-opacity=".6"/>
      <circle cx="20" cy="20" r="14" fill="#4fbf8b" fill-opacity=".14"/>
      <circle cx="15.5" cy="16" r="3.1" fill="#e8f6ec"/>
      <circle cx="24.5" cy="19" r="2.1" fill="#e8f6ec" fill-opacity=".7"/>
      <circle cx="18.5" cy="25" r="2.6" fill="#e8f6ec" fill-opacity=".85"/>
    </svg>
    <span><b>МИР</b><small>БИОТЕХНОЛОГИЙ</small></span>
  </div>

  <div>
    <h1>Настоящие<br>микроорганизмы<br><em>в ваших руках</em></h1>
    <p>Образовательный набор из шести культур, зафиксированных для безопасного изучения</p>
  </div>

  <div class="tags">
    <span>6 культур</span><span>6 карточек</span><span>Без лаборатории</span>
  </div>
</div>
</body>
</html>
